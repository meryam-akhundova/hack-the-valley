<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Slouch Dimmer</title>
  <link rel="stylesheet" href="monitor.css">
</head>
<body>
  <main>
    <h1>Slouch Dimmer</h1>
    <p class="hint">Keep this tab open while you work. Close it to turn dimming off.</p>

    <section class="row">
      <button id="connect">Connect sensor</button>
      <span id="status">Not connected</span>
    </section>

    <section class="row">
      <button id="calibrate" disabled>Calibrate (sit up straight first)</button>
      <span id="calStatus">Not calibrated</span>
    </section>

    <section class="readout">
      <div class="angle">
        <span id="angle">--</span>
        <small>tilt away from good posture</small>
      </div>
      <div id="state" class="state ok">Good posture</div>
    </section>

    <section class="settings">
      <label>
        <span>Slouch angle: <output id="thresholdOut"></output>°</span>
        <input type="range" id="threshold" min="5" max="40" step="1">
      </label>
      <label>
        <span>Wait before dimming: <output id="delayOut"></output> s</span>
        <input type="range" id="delay" min="0" max="30" step="1">
      </label>
      <label>
        <span>Dim strength: <output id="dimOut"></output>%</span>
        <input type="range" id="dim" min="20" max="90" step="5">
      </label>
    </section>
  </main>
  <script src="monitor.js"></script>
</body>
</html>
